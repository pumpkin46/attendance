# Ruff configuration for the backend.
#
# The default rule set (pycodestyle E4/E7/E9 + pyflakes F) catches real bugs
# (unused imports, undefined names, f-strings without placeholders, ...) without
# a style flood. Run with: ruff check app
target-version = "py313"
line-length = 100

[lint.per-file-ignores]
# SQLAlchemy declares cross-module relationships as string forward refs, e.g.
# `Mapped["Organization"]`, where the class is intentionally NOT imported into
# the module (it is resolved from the mapper registry at configuration time).
# Pyflakes' undefined-name check false-positives on those, so disable it for the
# ORM models only — it stays active everywhere else.
"app/models/*.py" = ["F821"]
